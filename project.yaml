  timeout_seconds: 1800
  pass_env:
  - ASSISTANT_POSTGRES_*
release_note: "kernel 改动（提交 {commit}）已合并到 main。需要上线时请在 H:\\AI\assistant-kernel 执行\
  \ .\\scripts\\deploy.ps1。"
map_path: docs/map.yaml
