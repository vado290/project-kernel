schema_version: project.v2
project_id: kernel
display_name: Assistant Kernel
purpose: 维护执行内核及项目管理：创建、路由、公共模板和确认背景
layout_version: 2
status: active
capabilities:
- routing
- project_management
- shared_context
- kernel_maintenance
- git_delivery
delivery: git-repo
share_with_kernel: improvements
multi_agent:
  enabled: true
  max_concurrent_subagents: 3
